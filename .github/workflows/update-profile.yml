name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: GustavoFerreira24
        run: python scripts/render_profile.py

      - name: Publish cards with unique filenames
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          cards = Path("cards")
          readme_path = Path("README.md")

          # Stable files generated by render_profile.py.
          source_names = [
              "hero-v3.svg",
              "contributions-v3.svg",
              "activity-v3.svg",
              "area-ai-v3.svg",
              "area-data-v3.svg",
              "area-systems-v3.svg",
              "project-rag-v3.svg",
              "project-weather-v3.svg",
              "project-bank-v3.svg",
          ]

          # Remove previously generated run-specific copies.
          for old in cards.glob("*-run-*.svg"):
              old.unlink()

          mapping = {}
          for source_name in source_names:
              source = cards / source_name
              if not source.exists():
                  raise FileNotFoundError(f"Missing rendered card: {source}")

              stem = source.stem
              target_name = f"{stem}-run-{run_id}.svg"
              target = cards / target_name
              shutil.copy2(source, target)

              mapping[f"./cards/{source_name}"] = f"./cards/{target_name}"

          text = readme_path.read_text(encoding="utf-8")

          # Convert any previous run-specific reference back to the stable base first.
          for source_name in source_names:
              stem = Path(source_name).stem
              pattern = rf'\./cards/{re.escape(stem)}-run-\d+\.svg'
              text = re.sub(pattern, f"./cards/{source_name}", text)

          # Replace stable paths with this run's unique filenames.
          for old, new in mapping.items():
              text = text.replace(old, new)

          readme_path.write_text(text, encoding="utf-8")
          PY

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cards/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
