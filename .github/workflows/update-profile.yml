name: Update profile cards

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: GustavoFerreira24
        run: python scripts/render_profile.py

      - name: Refresh README image cache key
        if: always()
        env:
          CACHE_KEY: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import re
          from pathlib import Path

          path = Path("README.md")
          text = path.read_text(encoding="utf-8")
          key = os.environ["CACHE_KEY"]

          text = re.sub(
              r'(\./cards/[^"?]+\.svg)(?:\?v=[^"]*)?',
              lambda m: f'{m.group(1)}?v={key}',
              text,
          )

          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit updated cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards/ README.md
          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
