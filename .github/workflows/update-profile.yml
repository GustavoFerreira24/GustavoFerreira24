name: Update profile cards

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"  # weekly, Monday

permissions:
  contents: write

jobs:
  render:
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render latest SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: GustavoFerreira24
        run: python scripts/render_profile.py

      - name: Publish cards with unique filenames
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          cards = Path("cards")
          readme_path = Path("README.md")

          source_names = [
              "hero-v4.svg",
              "activity-v4.svg",
              "academic-v4.svg",
              "personal-v4.svg",
              "focus-v4.svg",
              "title-building-dark-v4.svg",
              "title-building-light-v4.svg",
              "current-ccna-v4.svg",
              "current-laprizza-v4.svg",
              "current-hackathon-v4.svg",
              "title-selected-dark-v4.svg",
              "title-selected-light-v4.svg",
              "done-weather-v4.svg",
              "done-bank-v4.svg",
          ]

          for old in cards.glob("*-run-*.svg"):
              old.unlink()

          text = readme_path.read_text(encoding="utf-8")
          for source_name in source_names:
              stem = Path(source_name).stem
              text = re.sub(
                  rf'\./cards/{re.escape(stem)}-run-\d+\.svg',
                  f"./cards/{source_name}",
                  text,
              )

          for source_name in source_names:
              source = cards / source_name
              if not source.exists():
                  raise FileNotFoundError(f"Missing rendered card: {source}")
              stem = source.stem
              target_name = f"{stem}-run-{run_id}.svg"
              shutil.copy2(source, cards / target_name)
              text = text.replace(
                  f"./cards/{source_name}",
                  f"./cards/{target_name}",
              )

          readme_path.write_text(text, encoding="utf-8")
          PY

      - name: Commit refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cards/ README.md
          if git diff --cached --quiet; then
            echo "No profile changes to commit."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
