name: Update profile cards

on:
  push:
    branches:
      - main
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: write

jobs:
  render:
    # A bot commit is created after every refresh. Ignore that push so the
    # workflow does not trigger itself forever.
    if: github.event_name != 'push' || github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Render latest SVG cards
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_USERNAME: GustavoFerreira24
        run: python scripts/render_profile.py

      - name: Publish cards with unique filenames
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import os
          import re
          import shutil
          from pathlib import Path

          run_id = os.environ["RUN_ID"]
          cards = Path("cards")
          readme_path = Path("README.md")

          source_names = [
              "hero-v3.svg",
              "activity-v3.svg",
              "area-ai-v3.svg",
              "area-data-v3.svg",
              "area-systems-v3.svg",
              "project-rag-v3.svg",
              "project-laprizza-v3.svg",
          ]

          # Remove the previous run-specific copies so the repo stays clean.
          for old in cards.glob("*-run-*.svg"):
              old.unlink()

          text = readme_path.read_text(encoding="utf-8")

          # Normalize previous run-specific references back to stable paths.
          for source_name in source_names:
              stem = Path(source_name).stem
              text = re.sub(
                  rf'\./cards/{re.escape(stem)}-run-\d+\.svg',
                  f"./cards/{source_name}",
                  text,
              )

          # Copy the freshly rendered SVGs to URLs GitHub has never cached.
          for source_name in source_names:
              source = cards / source_name
              if not source.exists():
                  raise FileNotFoundError(f"Missing rendered card: {source}")

              stem = source.stem
              target_name = f"{stem}-run-{run_id}.svg"
              target = cards / target_name
              shutil.copy2(source, target)

              text = text.replace(
                  f"./cards/{source_name}",
                  f"./cards/{target_name}",
              )

          readme_path.write_text(text, encoding="utf-8")
          PY

      - name: Commit refreshed profile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A cards/ README.md

          if git diff --cached --quiet; then
            echo "No profile changes to commit."
          else
            git commit -m "chore: refresh profile cards"
            git push
          fi
