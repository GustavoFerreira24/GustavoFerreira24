<svg xmlns="http://www.w3.org/2000/svg" width="880.000" height="352" viewBox="0 0 880.000 352" role="img" aria-label="402 GitHub contributions"><title>402 GitHub contributions</title><style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.55)}75%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(4px)}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
.f{opacity:0;animation:fade .9s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .4s ease-out both}
.n{transform-box:fill-box;animation:nudge 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.r,.f,.g,.p,.n{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="880" height="340" rx="14" fill="#f3f0e8"/>
<text class="f" style="animation-delay:0.12s" x="40" y="58" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="12" letter-spacing="1" fill="#77736b">THE LAST 12 MONTHS ON GITHUB</text>
<text class="r" style="animation-delay:0.18s" x="38" y="116" font-family="Georgia, 'Times New Roman', serif" font-size="58" fill="#111111">402 <tspan font-style="italic">contributions</tspan></text>
<g class="r" style="animation-delay:0.32s">
  <text x="666" y="108" font-family="Georgia, 'Times New Roman', serif" font-size="44" fill="#315BFF">78 <tspan font-style="italic">days</tspan></text>
  <text x="666" y="132" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#77736b">active in the last year</text>
  <rect x="666" y="155" width="170" height="1" fill="#d8d2c7"/>
  <text x="666" y="205" font-family="Georgia, 'Times New Roman', serif" font-size="30" font-style="italic" fill="#111111">Projects over streaks.</text>
  <text x="666" y="231" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" fill="#77736b">The work matters more than the counter.</text>
</g>
