<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<style>
  .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  .fade { opacity:0; animation:fade .6s ease forwards; }
  .rise { opacity:0; transform:translateY(12px); animation:rise .65s cubic-bezier(.2,.8,.2,1) forwards; }
  .pop { opacity:0; transform:scale(.78); transform-box:fill-box; transform-origin:center; animation:pop .35s ease forwards; }
  .bar { transform:scaleY(0); transform-box:fill-box; transform-origin:bottom; animation:grow .75s cubic-bezier(.2,.8,.2,1) forwards; }
  .line { stroke-dasharray:800; stroke-dashoffset:800; animation:draw 1.1s ease forwards; }
  .pulse { animation:pulse 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes fade { to{opacity:1} }
  @keyframes rise { to{opacity:1; transform:translateY(0)} }
  @keyframes pop { to{opacity:1; transform:scale(1)} }
  @keyframes grow { to{transform:scaleY(1)} }
  @keyframes draw { to{stroke-dashoffset:0} }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce) {
    .fade,.rise,.pop,.bar,.line,.pulse {
      animation:none!important; opacity:1!important; transform:none!important;
      stroke-dashoffset:0!important;
    }
  }
</style>

<rect width="900" height="300" rx="22" fill="#F6F1E7"/>
<rect x="1" y="1" width="898" height="298" rx="21" fill="none" stroke="#D8D1C4"/>
<text x="38" y="43" fill="#6E6A63" font-size="11" letter-spacing="1.2" class="mono fade">THE LAST 12 MONTHS ON GITHUB</text>
<text x="38" y="103" fill="#111111" font-size="46" class="serif rise">391 contributions</text>

<text x="667" y="83" fill="#111111" font-size="30" class="serif rise" style="animation-delay:.12s">1 days</text>
<text x="667" y="101" fill="#6E6A63" font-size="11" class="sans">current streak</text>
<line x1="667" y1="118" x2="855" y2="118" stroke="#D8D1C4"/>

<text x="667" y="153" fill="#111111" font-size="30" class="serif rise" style="animation-delay:.18s">78 / 365</text>
<text x="667" y="171" fill="#6E6A63" font-size="11" class="sans">active days</text>
<line x1="667" y1="188" x2="855" y2="188" stroke="#D8D1C4"/>

<text x="667" y="223" fill="#111111" font-size="30" class="serif rise" style="animation-delay:.24s">44</text>
<text x="667" y="241" fill="#6E6A63" font-size="11" class="sans">on the busiest day</text>

