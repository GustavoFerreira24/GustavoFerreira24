-delay:0.50s"/><text x="523.0" y="278" text-anchor="middle" fill="#6E6A63" font-size="10" class="mono">Sep</text><rect x="560" y="228.6" width="30" height="28.4" rx="4" fill="#111111" class="bar" style="animation-delay:0.53s"/><text x="575.0" y="278" text-anchor="middle" fill="#6E6A63" font-size="10" class="mono">Oct</text><rect x="612" y="247.1" width="30" height="9.9" rx="4" fill="#315BFF" class="bar" style="animation-delay:0.56s"/><text x="627.0" y="278" text-anchor="middle" fill="#6E6A63" font-size="10" class="mono">Nov</text>
</svg>