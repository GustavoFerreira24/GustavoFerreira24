dth="38.3" height="39" rx="4" fill="#111111"/><text class="f" style="animation-delay:1.01s" x="349.2" y="208" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#77736b">Jun</text><rect class="g" style="animation-delay:1.02s" x="378.3" y="182" width="38.3" height="4" rx="4" fill="#111111"/><text class="f" style="animation-delay:1.07s" x="397.5" y="208" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#77736b">Jul</text><rect class="g" style="animation-delay:1.08s" x="426.7" y="182" width="38.3" height="4" rx="4" fill="#111111"/><text class="f" style="animation-delay:1.13s" x="445.8" y="208" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#77736b">Aug</text><rect class="g" style="animation-delay:1.14s" x="475.0" y="182" width="38.3" height="4" rx="4" fill="#111111"/><text class="f" style="animation-delay:1.19s" x="494.2" y="208" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#77736b">Sep</text><rect class="g" style="animation-delay:1.20s" x="523.3" y="164" width="38.3" height="22" rx="4" fill="#111111"/><text class="f" style="animation-delay:1.25s" x="542.5" y="208" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#77736b">Oct</text><rect class="g" style="animation-delay:1.26s" x="571.7" y="163" width="38.3" height="23" rx="4" fill="#315BFF"/><text class="f" style="animation-delay:1.31s" x="590.8" y="208" text-anchor="middle" font-family="'SFMono-Regular', Menlo, Monaco, Consolas, 'Liberation Mono', monospace" font-size="11" fill="#77736b">Nov</text>
