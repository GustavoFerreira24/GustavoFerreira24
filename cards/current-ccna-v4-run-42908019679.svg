<svg xmlns="http://www.w3.org/2000/svg" width="293.333" height="188" viewBox="0 0 293.333 188" role="img" aria-label="CURRENT PROJECT: CCNA AI Assistant"><title>CURRENT PROJECT: CCNA AI Assistant</title><style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.55)}75%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(4px)}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
.f{opacity:0;animation:fade .9s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .4s ease-out both}
.n{transform-box:fill-box;animation:nudge 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.r,.f,.g,.p,.n{animation:none!important;opacity:1!important;transform:none!important}}
</style>
<rect width="285.3333333333333" height="176" rx="14" fill="#fbfaf6"/>
<g class="r" style="animation-delay:0.35s">
  <rect x="24" y="28" width="8" height="8" rx="2" fill="#315BFF"/>
  <text x="40" y="37" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing=".8" fill="#77736b">CURRENT PROJECT</text>
  <text x="24" y="75" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-weight="700" font-size="18" fill="#111111">CCNA AI Assistant</text>
  <text x="24" y="105" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#44413c">RAG assistant grounded in CCNA</text><text x="24" y="125" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#44413c">study materials and semantic</text><text x="24" y="145" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.5" fill="#44413c">retrieval.</text>
  <text x="24" y="156" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11.5" fill="#77736b">Python · RAG · Embeddings</text>
</g>
</svg>