<svg xmlns="http://www.w3.org/2000/svg" width="440" height="205" viewBox="0 0 440 205">
<style>
  .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  .fade { opacity:0; animation:fade .6s ease forwards; }
  .rise { opacity:0; transform:translateY(12px); animation:rise .65s cubic-bezier(.2,.8,.2,1) forwards; }
  .pop { opacity:0; transform:scale(.78); transform-box:fill-box; transform-origin:center; animation:pop .35s ease forwards; }
  .bar { transform:scaleY(0); transform-box:fill-box; transform-origin:bottom; animation:grow .75s cubic-bezier(.2,.8,.2,1) forwards; }
  .line { stroke-dasharray:800; stroke-dashoffset:800; animation:draw 1.1s ease forwards; }
  .pulse { animation:pulse 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes fade { to{opacity:1} }
  @keyframes rise { to{opacity:1; transform:translateY(0)} }
  @keyframes pop { to{opacity:1; transform:scale(1)} }
  @keyframes grow { to{transform:scaleY(1)} }
  @keyframes draw { to{stroke-dashoffset:0} }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce) {
    .fade,.rise,.pop,.bar,.line,.pulse {
      animation:none!important; opacity:1!important; transform:none!important;
      stroke-dashoffset:0!important;
    }
  }
</style>

<rect width="440" height="205" rx="20" fill="#FFFDF8"/>
<rect x="1" y="1" width="438" height="203" rx="19" fill="none" stroke="#D8D1C4"/>
<rect x="22" y="22" width="7" height="7" fill="#315BFF" class="pop"/>
<text x="39" y="30" fill="#6E6A63" font-size="10" letter-spacing=".8" class="mono">CURRENT PROJECT</text>
<text x="22" y="76" fill="#111111" font-size="25" font-weight="700" class="sans rise">CCNA AI Assistant</text>
<text x="22" y="113" fill="#6E6A63" font-size="14" class="sans rise" style="animation-delay:.10s">RAG assistant grounded in CCNA</text>
<text x="22" y="135" fill="#6E6A63" font-size="14" class="sans rise" style="animation-delay:.14s">study materials and retrieval</text>
<text x="22" y="179" fill="#111111" opacity=".72" font-size="12" class="mono fade" style="animation-delay:.22s">Python · RAG · Embeddings</text>
</svg>