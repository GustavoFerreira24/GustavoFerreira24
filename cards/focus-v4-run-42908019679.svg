<svg xmlns="http://www.w3.org/2000/svg" width="293.333" height="222" viewBox="0 0 293.333 222" role="img" aria-label="FOCUS: AI · Data · Cloud"><title>FOCUS: AI · Data · Cloud</title><style>
@keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.55)}75%{opacity:1;transform:scale(1.05)}100%{opacity:1;transform:none}}
@keyframes nudge{0%,100%{transform:none}50%{transform:translateX(4px)}}
.r{opacity:0;animation:rise .8s cubic-bezier(.2,.7,.2,1) both;transform-box:fill-box}
.f{opacity:0;animation:fade .9s ease-out both}
.g{transform-box:fill-box;transform-origin:bottom;transform:scaleY(0);animation:grow .8s cubic-bezier(.2,.7,.2,1) both}
.p{opacity:0;transform-box:fill-box;transform-origin:center;animation:pop .4s ease-out both}
.n{transform-box:fill-box;animation:nudge 1.8s ease-in-out infinite}
@media (prefers-reduced-motion: reduce){.r,.f,.g,.p,.n{animation:none!important;opacity:1!important;transform:none!important}}
</style><g transform="translate(8.000 0)">
<rect width="285.3333333333333" height="210" rx="14" fill="#FFD13B"/>
<text class="f" style="animation-delay:0.61s" x="24" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.1" font-weight="700" fill="#111111">FOCUS</text>
<text class="n" x="250" y="38" font-family="'SFMono-Regular', Consolas, 'Liberation Mono', monospace" font-size="15" fill="#111111">→</text>
<text class="r" style="animation-delay:0.78s" x="22" y="91" font-family="Georgia, 'Times New Roman', serif" font-size="39" fill="#111111">AI · Data</text>
<text class="r" style="animation-delay:0.90s" x="22" y="128" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="39" fill="#111111">· Cloud</text>
<text class="r" style="animation-delay:1.13s" x="24" y="153" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#111111" opacity=".9">Career paths explored through real</text><text class="r" style="animation-delay:1.21s" x="24" y="172" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13.2" fill="#111111" opacity=".9">projects rather than theory alone.</text>
</g></svg>