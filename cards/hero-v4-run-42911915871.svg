</g>
<text class="r" style="animation-delay:0.12s" x="44" y="184" font-family="'Iowan Old Style', 'Palatino Linotype', 'Book Antiqua', Palatino, Georgia, serif" font-size="104" letter-spacing="-2" fill="#111111">Gustavo</text>
