="160" r="6" fill="#315BFF" class="pop" style="animation-delay:0.43s"/><circle cx="865" cy="122" r="4" fill="#111111" class="pop" style="animation-delay:0.47s"/><circle cx="748" cy="204" r="4" fill="#FFD13B" class="pop" style="animation-delay:0.52s"/><circle cx="842" cy="214" r="4" fill="#111111" class="pop" style="animation-delay:0.56s"/>
<text x="688" y="258" fill="#111111" opacity=".58" font-size="12" class="mono fade" style="animation-delay:.62s">AI // DATA // CLOUD</text>
</svg>