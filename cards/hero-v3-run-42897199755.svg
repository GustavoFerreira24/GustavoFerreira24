<svg xmlns="http://www.w3.org/2000/svg" width="900" height="300" viewBox="0 0 900 300">
<style>
  .sans { font-family: Inter, "Segoe UI", Arial, sans-serif; }
  .serif { font-family: Georgia, "Times New Roman", serif; }
  .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
  .fade { opacity:0; animation:fade .6s ease forwards; }
  .rise { opacity:0; transform:translateY(12px); animation:rise .65s cubic-bezier(.2,.8,.2,1) forwards; }
  .pop { opacity:0; transform:scale(.78); transform-box:fill-box; transform-origin:center; animation:pop .35s ease forwards; }
  .bar { transform:scaleY(0); transform-box:fill-box; transform-origin:bottom; animation:grow .75s cubic-bezier(.2,.8,.2,1) forwards; }
  .line { stroke-dasharray:800; stroke-dashoffset:800; animation:draw 1.1s ease forwards; }
  .pulse { animation:pulse 2.2s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
  @keyframes fade { to{opacity:1} }
  @keyframes rise { to{opacity:1; transform:translateY(0)} }
  @keyframes pop { to{opacity:1; transform:scale(1)} }
  @keyframes grow { to{transform:scaleY(1)} }
  @keyframes draw { to{stroke-dashoffset:0} }
  @keyframes pulse { 0%,100%{opacity:.35} 50%{opacity:1} }
  @media (prefers-reduced-motion: reduce) {
    .fade,.rise,.pop,.bar,.line,.pulse {
      animation:none!important; opacity:1!important; transform:none!important;
      stroke-dashoffset:0!important;
    }
  }
</style>

<rect width="900" height="300" rx="22" fill="#F6F1E7"/>
<rect x="1" y="1" width="898" height="298" rx="21" fill="none" stroke="#D8D1C4"/>

<rect x="38" y="34" width="9" height="9" fill="#315BFF" class="pop"/>
<text x="58" y="43" fill="#6E6A63" font-size="12" letter-spacing="1.2" class="mono fade" style="animation-delay:.08s">COMPUTER ENGINEERING @ ISEP</text>

<text x="38" y="120" fill="#111111" font-size="58" class="serif rise" style="animation-delay:.12s">Gustavo</text>
<text x="38" y="178" fill="#111111" font-size="65" font-style="italic" class="serif rise" style="animation-delay:.22s">Ferreira</text>

<text x="42" y="224" fill="#6E6A63" font-size="17" class="sans rise" style="animation-delay:.32s">Building practical systems across AI, data and cloud -</text>
<text x="42" y="248" fill="#6E6A63" font-size="17" class="sans rise" style="animation-delay:.38s">one project at a time.</text>

<circle cx="44" cy="274" r="6" fill="#28A745" class="pulse"/>
<text x="60" y="280" fill="#111111" font-size="16" font-weight="700" letter-spacing=".6" class="mono fade" style="animation-delay:.48s">OPEN TO A CURRICULAR INTERNSHIP · 2027</text>

