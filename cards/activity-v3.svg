ion-delay:0.50s"/><text x="583.0" y="280" text-anchor="middle" fill="#6E6A63" font-size="10" class="mono">Sep</text><rect x="624" y="224.5" width="34" height="33.5" rx="4" fill="#111111" class="bar" style="animation-delay:0.53s"/><text x="641.0" y="280" text-anchor="middle" fill="#6E6A63" font-size="10" class="mono">Oct</text><rect x="682" y="237.6" width="34" height="20.4" rx="4" fill="#315BFF" class="bar" style="animation-delay:0.56s"/><text x="699.0" y="280" text-anchor="middle" fill="#6E6A63" font-size="10" class="mono">Nov</text>
</svg>